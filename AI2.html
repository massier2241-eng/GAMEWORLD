<!DOCTYPE html
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    /* 1. 배경: 보라색-검정 그라데이션 */
    body {
        margin: 0;
        padding: 0;
        min-height: 100vh; /* height 대신 min-height로 변경 (내용 많아질 때 대비) */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #4b0082 0%, #000000 100%);
        color: white;
        font-family: 'Pretendard', sans-serif;
        padding: 20px; /* 스마트폰 여백 확보 */
        box-sizing: border-box;
    }

    /* 2. 제목: 기기 크기에 따라 글자 크기 조절 */
    h1 {
        font-size: clamp(1.8rem, 8vw, 3.5rem); /* 최소 1.8rem, 화면의 8%, 최대 3.5rem */
        margin-bottom: 2rem;
        text-shadow: 0 0 20px rgba(138, 43, 226, 0.8);
        text-align: center; /* 가운데 정렬 필수 */
        word-break: keep-all; /* 단어 단위 줄바꿈으로 깔끔하게 */
    }

    /* 3. 버튼 컨테이너: 가로폭 100% 활용 */
    .btn-container {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
        max-width: 800px; /* 너무 퍼지지 않게 제한 */
    }

    /* 4. 버튼: 터치하기 쉬운 크기로 최적화 */
    .main-btn {
        padding: 12px 25px;
        font-size: clamp(0.9rem, 4vw, 1.2rem); /* 폰트 크기 자동 조절 */
        font-weight: bold;
        color: white;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid #8a2be2;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        backdrop-filter: blur(5px);
        flex: 1 1 auto; /* 기기 너비에 맞춰 버튼 크기 유연하게 */
        min-width: 140px; /* 최소 너비 유지 */
        max-width: 300px;
        text-align: center;
    }

    .main-btn:hover {
        background: #8a2be2;
        box-shadow: 0 0 30px rgba(138, 43, 226, 0.6);
        transform: translateY(-3px);
    }

    /* 5. 하단바: 작은 화면에서 글씨 작게 */
    #ai-status {
        position: relative; /* 고정 위치 해제 (내용 길어질 때 겹침 방지) */
        margin-top: 40px;
        font-size: 0.8rem;
        color: #aaa;
        text-align: center;
    }
</style>
</head>

        <a href="https://ai.studio/apps/0dde2483-8a23-4cf6-809c-02f4ec1891e5?fullscreenApplet=true" class="main-btn" style="border-color: #007bff;">🤑가챠 게임🤑</a>

</body>
</html>
